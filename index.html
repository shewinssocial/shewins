<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheWins — Women Forum</title>
    <meta
      name="description"
      content="A vibrant, welcoming community empowering women through networking, events, skill development, and genuine connection."
    />
    <meta property="og:title" content="SeaWINS — Women Forum" />
    <meta
      property="og:description"
      content="A community built by women, for women. Connecting across professions and cities."
    />
    <meta property="og:type" content="website" />

    <!--
      Cinematic SeaWINS Logo Intro
      - Clean full-screen brand background
      - Tiny SeaWINS logo emerges smoothly (18% -> 100%)
      - Subtle blur-to-sharp focus
      - Signature breathing scale (1.0 -> 1.035 -> 1.0)
      - Graceful veil lift into homepage
    -->
    <style>
      html.seawins-instant #app-loader,
      html.shewins-instant #app-loader {
        display: none !important;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbf8f2;
        background: radial-gradient(ellipse at center, #fdfbf8 0%, #f4efe6 100%);
        pointer-events: none;
      }

      .cinematic-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cinematic-logo {
        width: 140px;
        height: 140px;
        max-width: 80vw;
        max-height: 80vh;
        object-fit: contain;
        display: block;
        opacity: 0.25;
        transform: scale(0.2);
      }

      .app-loader-hint {
        position: absolute;
        bottom: 24px;
        margin: 0;
        max-width: 280px;
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        line-height: 1.5;
        color: #8a796f;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-cream text-ink font-body antialiased">
    <script>
      (function() {
        try {
          if (
            sessionStorage.getItem('seawins_intro_seen') === '1' ||
            sessionStorage.getItem('shewings-intro-seen') === '1' ||
            sessionStorage.getItem('shewins_loaded') === 'true'
          ) {
            document.documentElement.classList.add('seawins-instant', 'shewins-instant');
          }
        } catch (e) {}
      })();
      window.__appLoaderStart = Date.now();
      setTimeout(function () {
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        var hint = document.createElement('p');
        hint.className = 'app-loader-hint';
        hint.textContent =
          'Still loading — open the browser console (F12) for the error, or check your .env setup.';
        loader.appendChild(hint);
      }, 6000);
    </script>
    <div id="app-loader" aria-hidden="true">
      <div class="cinematic-logo-wrap">
        <img src="/sl2.png" alt="SeaWINS" class="cinematic-logo" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
